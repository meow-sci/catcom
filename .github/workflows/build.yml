name: Build and test

# ONE Linux job does everything, for every platform. No OS matrix:
#   1. cross-builds the natives for win-x64, linux-x64 and osx-arm64 with the pinned zig
#      (tools/build-natives.sh: LuaJIT + the tree-sitter TypeScript parser), verifying each
#      library's format, exports and dependencies, and running the Linux and (under wine) the
#      Windows builds;
#   2. downloads Neovim, the language servers and the TypeScript assets for all three platforms
#      (tools/fetch-all.sh, with the natives from step 1);
#   3. builds the solution, runs the game-free test suites (on Linux);
#   4. deploys the complete mod folder (KsaScripting.Dist refuses to build without every binary)
#      and validates it for all three platforms with tools/check-dist.py; the folder is uploaded
#      as the `ksa-scripting-dist` artifact.
#
# The KSA reference assemblies are licensed game files in the private repo
# meow-sci/ksa-game-assemblies (DLLs under current/dll/). Only KsaScripting.Ksa,
# KsaScripting.GameMod, KsaScripting.PurrTty and the Ksa.CompileCheck project reference them;
# their sources are compile-removed when KSA.dll is absent (see Directory.Build.props). Access
# uses the KSA_GAME_ASSEMBLIES_PAT repo secret (a fine-grained read-only PAT, same pattern as
# gatOS). Without the secret the game-coupled projects drop out, no dist is deployed, and the
# build and tests stay green.
#
# Natives release: pushing a `natives-v*` tag (or running this workflow by hand with
# `publish_tag`) publishes the natives built by that run as a GitHub release. Every developer
# host downloads them from there (tools/fetch-natives.*; tools/natives.pin names the tag).

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'release/**'
    tags:
      - 'natives-v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Publish the natives built by this run as a GitHub release with this tag (natives-vN). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write  # creating the natives release; everything else only reads
  checks: write    # test-reporter publishes results as a check run

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (linux host, all platforms)
    runs-on: ubuntu-latest
    env:
      # Directory.Build.props resolves this before any per-OS default. When the
      # PAT is missing the dir simply doesn't exist and the guarded references drop out.
      KSA_DLL_DIR: ${{ github.workspace }}/.tmp/ksa-game-assemblies/current/dll
      # KsaScripting.Dist deploys the mod folder here, inside the workspace, instead of the per-user default.
      KSA_SCRIPTING_DIST_DIR: ${{ github.workspace }}/.tmp/dist/ksa-scripting
      # secrets.* is not allowed directly in step `if:`; surface it via env.
      KSA_PAT: ${{ secrets.KSA_GAME_ASSEMBLIES_PAT }}
      # The natives release tag to publish, if any (tag push or manual input).
      PUBLISH_TAG: ${{ startsWith(github.ref, 'refs/tags/natives-v') && github.ref_name || inputs.publish_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout ksa-scripting
        uses: actions/checkout@v6

      - name: Checkout private KSA assemblies
        if: env.KSA_PAT != ''
        uses: actions/checkout@v6
        with:
          repository: meow-sci/ksa-game-assemblies
          path: .tmp/ksa-game-assemblies
          token: ${{ env.KSA_PAT }}
          persist-credentials: false
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The zig tarball, the LuaJIT checkout and the grammar tarball only change with their pins.
      - name: Cache toolchain and sources
        uses: actions/cache@v4
        with:
          path: |
            tools/.cache/zig
            tools/.cache/luajit-src
            tools/.cache/tree-sitter-typescript-*.tar.xz
          key: natives-src-${{ hashFiles('tools/zig.pin', 'tools/luajit.pin', 'tools/ts-parser.pin') }}

      # wine lets the cross-built Windows LuaJIT run its version / JIT / no-FFI checks here.
      - name: Install wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 || sudo apt-get install -y -qq wine
          command -v wine64 || command -v wine

      - name: Build natives for all platforms (zig cross-compile)
        run: bash tools/build-natives.sh

      - name: Fetch every shipped binary for all platforms
        run: bash tools/fetch-all.sh --natives-from tools/.cache/natives-out

      - name: Build
        run: dotnet build ksa-scripting.slnx -c Release --nologo -v quiet

      - name: Test
        id: test
        run: dotnet test ksa-scripting.slnx -c Release --nologo -v quiet --no-build --logger trx --results-directory .tmp/test-results

      - name: Check dist (all platforms)
        if: env.KSA_PAT != ''
        run: python3 tools/check-dist.py .tmp/dist/ksa-scripting

      - name: Upload dist artifact
        if: env.KSA_PAT != '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ksa-scripting-dist
          path: .tmp/dist/ksa-scripting
          retention-days: 3
          compression-level: 1

      - name: Publish natives release
        if: env.PUBLISH_TAG != ''
        run: |
          set -euo pipefail
          tag="$PUBLISH_TAG"
          case "$tag" in natives-v*) ;; *) echo "publish tag must look like natives-vN, got '$tag'" >&2; exit 1 ;; esac
          cd tools/.cache/natives-out
          {
            echo "Cross-built natives for ksa-scripting (tools/build-natives.sh, run ${{ github.run_id }} on ${{ github.sha }})."
            echo
            echo '```'
            cat NATIVES.txt
            echo
            cat SHA256SUMS
            echo '```'
            echo
            echo "Downloaded by tools/fetch-natives.sh / .ps1 when tools/natives.pin names this tag."
          } > release-notes.md
          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" -R "${{ github.repository }}" --clobber natives-*.tar.gz SHA256SUMS NATIVES.txt
            gh release edit "$tag" -R "${{ github.repository }}" --notes-file release-notes.md
          else
            gh release create "$tag" -R "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "Natives $tag" --notes-file release-notes.md natives-*.tar.gz SHA256SUMS NATIVES.txt
          fi

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        with:
          name: test results (linux)
          path: .tmp/test-results/*.trx
          reporter: dotnet-trx

      - name: Upload test results artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        with:
          name: test-results
          path: .tmp/test-results
